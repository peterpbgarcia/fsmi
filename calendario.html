<!DOCTYPE html>
<html lang="it">

    <meta name="theme-color"

    <!-- =========================

    ========================== -->

    <aside class="side-nav" id="sideNav">

        <div class="side-nav-top">

            <div class="nav-brand">

                <div class="nav-logo">
                    <img src="img/logo.png" alt="Logo Congregazione">
                </div>

                <div class="nav-brand-text">
                    <strong>CONGREGAZIONE DEI</strong>
                    <span>Figli di Santa Maria Immacolata</span>
                </div>

            </div>

        </div>


        <nav class="nav-menu">

            <a href="index.html" class="nav-item" data-page="home">
                <span class="nav-icon">⌂</span>
                <span class="nav-label">Home</span>
            </a>

            <a href="religiosi.html" class="nav-item" data-page="religiosi">

            <a href="documenti.html" class="nav-item" data-page="documenti">

                <span class="nav-label">Documenti</span>
            </a>

            <a href="#calendario" class="nav-item active" data-page="calendario">

                <span class="nav-label">Calendario</span>
            </a>

        </nav>


        <div class="side-nav-bottom">

            <span class="status-dot"></span>
            <span>Comunità</span>

        </div>

    </aside>


    <!-- =========================

    ========================== -->

    <div class="nav-overlay" id="navOverlay"></div>


    <!-- =========================
         MAIN APP
    ========================== -->

    <main class="app">



    <!-- ======================================================
         TOP BAR
    ======================================================= -->

    <header class="topbar">


        <div class="topbar-left"> 
            <div class="mobile-title"> 
                <img src="img/logo.png" alt="Logo Figli di Santa Maria Immacolata" class="topbar-logo"> 
                <span> CONGREGAZIONE DEI 
                    <br>Figli di Santa Maria Immacolata </span> 
                </div> 
        </div>



        <div class="topbar-right">

            <button class="icon-button"
                    type="button"
                    title="Notifiche"
                    aria-label="Notifiche">

            <button class="profile-button"
                    type="button"
                    aria-label="Profilo">

                <span>
                    R
                </span>

            </button>

<iframe

</iframe>
