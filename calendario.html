
<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
          content="#1683c6">

    <meta name="description"
          content="Calendario della Congregazione Figli di Santa Maria Immacolata">

    <title>Calendario | Figli di Santa Maria Immacolata</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        /* ==================================================
           CALENDAR PAGE
        ================================================== */

        html,
        body {
            width: 100%;
            height: 100%;
            min-height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body.calendar-page {
            background: #eaf6ff;
        }

        .calendar-container {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .calendar-frame {
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
            background: #eaf6ff;
        }
    </style>
</head>

<body class="calendar-page">

    <main class="calendar-container">

        <iframe
            class="calendar-frame"
            title="Calendario della Congregazione"
            src="https://calendar.google.com/calendar/embed?height=600&amp;wkst=1&amp;ctz=Europe%2FRome&amp;showPrint=0&amp;mode=MONTH&amp;hl=it&amp;showCalendars=0&amp;src=YjF2dGFkdXYydTBtdjdkaTJyZjhpaTAzMGNAZ3JvdXAuY2FsZW5kYXIuZ29vZ2xlLmNvbQ&amp;color=%237cb342"
            loading="eager"
            scrolling="no"
            allowfullscreen>
        </iframe>

    </main>

    <!-- Universal application and overlay-stack logic -->
    <script src="js/app.js"></script>

</body>

</html>
