
<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
          content="#1683c6">

    <meta name="description"
          content="Annuario ufficiale della Congregazione dei Figli di Santa Maria Immacolata">

    <title>Annuario | Figli di Santa Maria Immacolata</title>

    <!-- Universal and document styles -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/documenti.css">
    <link rel="stylesheet" href="css/subcss.css">

    <!-- PDF.js Viewer Element -->
    <script
        type="module"
        src="https://cdn.jsdelivr.net/npm/pdfjs-viewer-element/dist/pdfjs-viewer-element.js">
    </script>

    <style>
        /* ==============================================
           DOCUMENT PDF VIEWER
        ============================================== */

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }

        body.document-viewer-page {
            min-height: 100vh;
            background: #eaf6ff;
        }

        .document-viewer-container {
            width: 100%;
            min-height: 100vh;
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        .pdf-container {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            overflow: hidden;
            box-sizing: border-box;

            background: #ffffff;
            border: 1px solid #c9e5f6;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.10);
        }

        pdfjs-viewer-element {
            display: block;
            width: 100%;
            height: 100vh;
            height: 100dvh;
        }

        @media (max-width: 600px) {
            .pdf-container {
                border: 0;
                border-radius: 0;
                box-shadow: none;
            }
        }
    </style>
</head>

<body class="document-viewer-page">

    <main class="document-viewer-container">

        <div class="pdf-container">

            <pdfjs-viewer-element
                src="pdf/annuariofsmi.pdf"
                page="1"
                viewer-path="https://jsdelivr.net">
            </pdfjs-viewer-element>

        </div>

    </main>

    <!-- Universal overlay-stack logic -->
    <script src="../js/app.js"></script>

    <!-- Document-specific logic -->
    <script src="js/documenti.js"></script>

</body>

</html>
