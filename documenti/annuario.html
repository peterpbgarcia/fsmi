<!-- ==========================================================
     COSTITUZIONE — FLOATING READING CONTROLS
========================================================== -->

<div class="constitution-tools" id="constitutionTools">

    <!-- EXPANDED CONTROLS -->

    <div class="constitution-tools-menu" id="constitutionToolsMenu">

        <!-- TORNA ALL'INDICE -->

        <button
            type="button"
            class="constitution-tool"
            id="constitutionBackToIndex"
            aria-label="Torna all'indice"
            title="Torna all'indice">

            ↑

        </button>


        <!-- SEPARATION BETWEEN NAVIGATION AND TEXT SIZE -->

        <div class="constitution-tools-gap"></div>


        <!-- AUMENTA TESTO -->

        <button
            type="button"
            class="constitution-tool"
            id="constitutionIncrease"
            aria-label="Aumenta dimensione del testo"
            title="Aumenta testo">

            +

        </button>


        <!-- DIMINUISCI TESTO -->

        <button
            type="button"
            class="constitution-tool"
            id="constitutionDecrease"
            aria-label="Diminuisci dimensione del testo"
            title="Diminuisci testo">

            −

        </button>

    </div>


    <!-- MAIN BUBBLE -->

    <button
        type="button"
        class="constitution-tools-toggle"
        id="constitutionToolsToggle"
        aria-label="Apri strumenti di lettura"
        aria-expanded="false"
        aria-controls="constitutionToolsMenu">

        ⋮

    </button>

</div>
