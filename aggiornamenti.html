
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4AAEE8">
  <title>Aggiornamenti</title>
  <link rel="stylesheet" href="css/aggiornamenti.css">
</head>
<body>
  <main class="updates-page">

    <section class="celebrations" aria-label="Prossime celebrazioni">
      <div class="celebration-carousel" id="celebrationCarousel">

        <div class="celebration-loading" id="celebrationStatus" role="status">
          Caricamento delle celebrazioni…
        </div>

        <div
          class="celebration-track"
          id="celebrationTrack"
          aria-live="polite">
        </div>

      </div>
    </section>

    <section class="vatican-news" aria-label="Notizie dal Vaticano">
      <vaticannews-widget lang="it" fontSize="14"></vaticannews-widget>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <script src="https://www.vaticannews.va/widget.js"></script>
  <script src="js/aggiornamenti.js"></script>
</body>
</html>
