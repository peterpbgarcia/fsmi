<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aggiornamenti</title>

  <link rel="stylesheet" href="css/aggiornamenti.css">
</head>
<body>

  <main class="updates-page">

    <!-- TOP SECTION: UPCOMING CELEBRATIONS -->
    <section class="celebrations" aria-label="Prossime celebrazioni">

      <div class="celebration-carousel" id="celebrationCarousel">
        <div class="celebration-loading" id="celebrationStatus">
          Caricamento delle celebrazioni…
        </div>

        <button
          class="carousel-arrow carousel-prev"
          id="previousCelebration"
          type="button"
          aria-label="Celebrazione precedente"
        >‹</button>

        <div
          class="celebration-track"
          id="celebrationTrack"
          aria-live="polite"
        ></div>

        <button
          class="carousel-arrow carousel-next"
          id="nextCelebration"
          type="button"
          aria-label="Celebrazione successiva"
        >›</button>
      </div>

    </section>

    <!-- BOTTOM SECTION: VATICAN NEWS -->
    <section class="vatican-news" aria-label="Notizie dal Vaticano">
      <vaticannews-widget
        lang="it"
        fontSize="14">
      </vaticannews-widget>
    </section>

  </main>

  <!-- SheetJS: reads the Excel workbook -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

  <!-- Vatican News widget -->
  <script src="https://www.vaticannews.va/widget.js"></script>

  <script src="js/aggiornamenti.js"></script>
</body>
</html>
