
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#1683c6">
    <meta name="description" content="Elenco dei religiosi della Congregazione dei Figli di Santa Maria Immacolata">

    <title>I Religiosi | Figli di Santa Maria Immacolata</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/religiosi.css">
</head>

<body class="religiosi-page">

    <main class="religiosi-container">

        <!-- Page title -->
        <section class="religiosi-page-header">
            <h1>I RELIGIOSI</h1>
            <p>
                Consulta la scheda dei religiosi della Congregazione.
            </p>
        </section>

        <!-- Search -->
        <section class="religiosi-search-section">
            <div class="religiosi-search-wrapper">

                <div class="religiosi-search-box">

                    <span class="search-icon" aria-hidden="true">⌕</span>

                    <input
                        type="text"
                        id="religiousSearch"
                        placeholder="Cerca un religioso..."
                        autocomplete="off"
                        aria-label="Cerca un religioso"
                        aria-expanded="false"
                        aria-controls="religiousSuggestions"
                    >

                    <button
                        class="search-clear"
                        id="searchClear"
                        type="button"
                        aria-label="Cancella ricerca"
                        title="Cancella ricerca"
                    >
                        ×
                    </button>

                    <span class="search-arrow" aria-hidden="true">▾</span>

                </div>

                <div
                    class="religiosi-suggestions"
                    id="religiousSuggestions"
                    role="listbox"
                    aria-label="Religiosi"
                ></div>

            </div>
        </section>

        <!-- Religious identity card -->
        <section class="religious-id-card" aria-label="Scheda del religioso">

            <!-- Card header -->
            <div class="religious-id-header">

                <div class="religious-id-brand">

                    <div class="religious-id-logo">
                        <img
                            src="img/logo.png"
                            alt="Logo della Congregazione"
                        >
                    </div>

                    <div class="religious-id-brand-text">
                        <strong>CONGREGAZIONE DEI</strong>
                        <span>Figli di Santa Maria Immacolata</span>
                    </div>

                </div>

                <div class="religious-id-type">RELIGIOSO</div>

            </div>

            <!-- Card body -->
            <div class="religious-id-body">

                <!-- Identity -->
                <div class="religious-identity">

                    <div class="religious-identity-text">

                        <div class="religious-name-field">
                            <span class="religious-name-label">COGNOME</span>
                            <strong
                                class="religious-name-value"
                                id="religiousSurname"
                            ></strong>
                        </div>

                        <div class="religious-name-field">
                            <span class="religious-name-label">NOME</span>
                            <strong
                                class="religious-name-value"
                                id="religiousFirstname"
                            ></strong>
                        </div>

                        <div
                            class="religious-profession"
                            id="relstatus"
                        ></div>

                    </div>

                    <!-- Photo -->
                    <div class="religious-photo-frame">
                        <img
                            id="religiousPhoto"
                            src="img/logo.png"
                            alt="Foto del religioso"
                        >
                    </div>

                </div>

                <!-- Personal data -->
                <div class="religious-data-section">

                    <h2 class="religious-section-title">DATI PERSONALI</h2>

                    <div class="religious-data-grid">

                        <div class="religious-data-item">
                            <span class="info-label">NASCITA</span>
                            <span class="info-value" id="religiousBirth"></span>
                        </div>

                        <div class="religious-data-item">
                            <span class="info-label">NAZIONALITÀ</span>
                            <span class="info-value" id="religiousNationality"></span>
                        </div>

                        <div class="religious-data-item">
                            <span class="info-label">PROFESSIONE</span>
                            <span class="info-value" id="religiousProfessionData"></span>
                        </div>

                        <div class="religious-data-item">
                            <span class="info-label">LUOGO DI MISSIONE</span>
                            <span class="info-value" id="religiousMission"></span>
                        </div>

                    </div>
                </div>

                <!-- Contacts -->
                <div class="religious-data-section">

                    <h2 class="religious-section-title">CONTATTI</h2>

                    <div class="religious-contact-grid">

                        <div class="religious-contact-item">

                            <span class="contact-icon" aria-hidden="true">☎</span>

                            <div class="contact-content">
                                <span class="info-label">CELLULARE</span>

                                <a
                                    id="religiousPhone"
                                    class="contact-link"
                                    href="#"
                                ></a>
                            </div>

                        </div>

                        <div class="religious-contact-item">

                            <span class="contact-icon" aria-hidden="true">✉</span>

                            <div class="contact-content">
                                <span class="info-label">EMAIL</span>

                                <a
                                    id="religiousEmail"
                                    class="contact-link"
                                    href="#"
                                ></a>
                            </div>

                        </div>

                    </div>
                </div>

            </div>

            <!-- Card footer -->
            <div class="religious-id-footer">
                <span>FIGLI DI SANTA MARIA IMMACOLATA</span>
            </div>

        </section>

    </main>

    <!-- Scripts -->
    <script src="js/xlsx.full.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/religiosi.js"></script>

</body>
</html>
